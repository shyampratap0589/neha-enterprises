<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="210" fill="#ffffff" opacity="0.6" />

  <g transform="translate(130, 110)" filter="url(#shadow)">
    <!-- Compact Square Aluminum Body -->
    <rect x="30" y="50" width="230" height="230" rx="18" fill="url(#body)" stroke="#475569" stroke-width="2.5" />
    
    <!-- 4 Corner Mounting Holes -->
    <circle cx="60" cy="80" r="14" fill="#334155" />
    <circle cx="60" cy="80" r="8" fill="#f8fafc" />
    <circle cx="230" cy="80" r="14" fill="#334155" />
    <circle cx="230" cy="80" r="8" fill="#f8fafc" />
    <circle cx="60" cy="250" r="14" fill="#334155" />
    <circle cx="60" cy="250" r="8" fill="#f8fafc" />
    <circle cx="230" cy="250" r="14" fill="#334155" />
    <circle cx="230" cy="250" r="8" fill="#f8fafc" />

    <!-- Sensor Switch Slots on Body -->
    <rect x="25" y="125" width="240" height="12" rx="3" fill="#1e293b" />
    <rect x="25" y="195" width="240" height="12" rx="3" fill="#1e293b" />

    <!-- Center Cylinder Bore & Piston Rod Ring -->
    <circle cx="145" cy="165" r="64" fill="#475569" stroke="#334155" stroke-width="2" />
    <circle cx="145" cy="165" r="48" fill="url(#rod)" stroke="#0f172a" stroke-width="1.5" />
    <!-- Female Rod Thread Center Hole -->
    <circle cx="145" cy="165" r="18" fill="#0f172a" />
    <circle cx="145" cy="165" r="12" fill="#1e293b" stroke="#64748b" stroke-dasharray="2 1" />

    <!-- Air Ports on Top & Side -->
    <rect x="130" y="32" width="30" height="20" rx="4" fill="#eab308" stroke="#854d0e" stroke-width="1.5" />
    <ellipse cx="145" cy="32" rx="10" ry="4" fill="#713f12" />

    <!-- Model Spec Plate -->
    <rect x="90" y="222" width="110" height="24" rx="4" fill="#0284c7" />
    <text x="145" y="238" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">CQ2B 40x25</text>
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">COMPACT SPACE-SAVING AIR CYLINDER</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">CQ2 Series • Fixture Clamping & Robotic Automation</text>
  </g>
</svg>
