<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Studio Surface -->
  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  
  <!-- Subtle circular grid / studio backlight -->
  <circle cx="300" cy="300" r="220" fill="#ffffff" opacity="0.6" />
  
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <!-- Chrome Piston Rod extending to the right -->
    <rect x="360" y="180" width="130" height="32" rx="4" fill="url(#chrome)" stroke="#64748b" stroke-width="1.5" />
    
    <!-- Piston Rod Thread & Hex Nut -->
    <rect x="470" y="183" width="18" height="26" fill="url(#alu)" stroke="#475569" />
    <path d="M 488,186 L 515,186 L 515,206 L 488,206 Z" fill="url(#chrome)" stroke="#64748b" stroke-dasharray="2 1" />

    <!-- Rear End Cap (Blue Anodized) -->
    <rect x="60" y="110" width="55" height="170" rx="10" fill="url(#cap)" stroke="#0369a1" stroke-width="2" />
    <!-- Rear Clevis Hole -->
    <circle cx="87" cy="195" r="14" fill="#0f172a" opacity="0.3" />
    <circle cx="87" cy="195" r="9" fill="#f8fafc" />
    
    <!-- Main Cylinder Barrel (Aluminum Profile Body) -->
    <rect x="115" y="120" width="220" height="150" rx="6" fill="url(#alu)" stroke="#64748b" stroke-width="2" />
    
    <!-- Cylinder Grooves & Tie-rod simulation lines -->
    <line x1="115" y1="135" x2="335" y2="135" stroke="#475569" stroke-width="2.5" />
    <line x1="115" y1="255" x2="335" y2="255" stroke="#475569" stroke-width="2.5" />
    <rect x="140" y="150" width="170" height="90" rx="4" fill="#cbd5e1" opacity="0.4" />
    
    <!-- Technical Label Badge on Barrel -->
    <rect x="175" y="165" width="100" height="36" rx="4" fill="#0f172a" />
    <text x="225" y="182" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">NEHA ENTERPRISES</text>
    <text x="225" y="194" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">SC-63x100 • 10 BAR</text>

    <!-- Front End Cap (Blue Anodized) -->
    <rect x="335" y="110" width="55" height="170" rx="10" fill="url(#cap)" stroke="#0369a1" stroke-width="2" />
    
    <!-- Piston Rod Bearing Bushing -->
    <rect x="375" y="170" width="18" height="52" rx="4" fill="url(#chrome)" stroke="#475569" />

    <!-- Air Ports (Brass Bushings) -->
    <!-- Rear Port -->
    <rect x="80" y="92" width="22" height="20" rx="3" fill="url(#brass)" stroke="#78350f" stroke-width="1.5" />
    <ellipse cx="91" cy="92" rx="8" ry="4" fill="#78350f" />
    <!-- Front Port -->
    <rect x="345" y="92" width="22" height="20" rx="3" fill="url(#brass)" stroke="#78350f" stroke-width="1.5" />
    <ellipse cx="356" cy="92" rx="8" ry="4" fill="#78350f" />

    <!-- Cushion Adjustment Screws -->
    <circle cx="102" cy="130" r="5" fill="url(#brass)" />
    <line x1="99" y1="130" x2="105" y2="130" stroke="#78350f" stroke-width="1.5" />
    <circle cx="345" cy="130" r="5" fill="url(#brass)" />
    <line x1="342" y1="130" x2="348" y2="130" stroke="#78350f" stroke-width="1.5" />

    <!-- 4 Tie Rod Nuts -->
    <circle cx="120" cy="116" r="6" fill="#334155" />
    <circle cx="120" cy="274" r="6" fill="#334155" />
    <circle cx="330" cy="116" r="6" fill="#334155" />
    <circle cx="330" cy="274" r="6" fill="#334155" />
  </g>

  <!-- Technical Spec Watermark Overlay -->
  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">ISO 15552 STANDARD CYLINDER</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">Double Acting • Hard Anodized Aluminum Barrel</text>
  </g>
</svg>
