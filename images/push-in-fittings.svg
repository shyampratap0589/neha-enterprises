<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="nickel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="blue-collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="brass-thread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="215" fill="#ffffff" opacity="0.6" />

  <!-- Left: Male Straight Fitting (PC 8-02) -->
  <g transform="translate(130, 110)" filter="url(#shadow)">
    <!-- Blue Release Collar Ring -->
    <ellipse cx="70" cy="50" rx="36" ry="16" fill="url(#blue-collar)" stroke="#0369a1" stroke-width="2" />
    <ellipse cx="70" cy="46" rx="22" ry="10" fill="#0f172a" />
    <rect x="34" y="50" width="72" height="25" rx="4" fill="url(#blue-collar)" />

    <!-- Hex Nut Body (Nickel-Plated Brass) -->
    <path d="M 30,75 L 110,75 L 120,130 L 20,130 Z" fill="url(#nickel)" stroke="#475569" stroke-width="2" />
    <line x1="55" y1="75" x2="48" y2="130" stroke="#64748b" stroke-width="2" />
    <line x1="85" y1="75" x2="92" y2="130" stroke="#64748b" stroke-width="2" />

    <!-- Male BSP Thread with Pre-Coated White Teflon Sealant -->
    <rect x="38" y="130" width="64" height="65" rx="3" fill="url(#brass-thread)" stroke="#854d0e" stroke-width="1.5" />
    <!-- White Teflon Thread Sealant Band -->
    <rect x="38" y="145" width="64" height="35" fill="#ffffff" opacity="0.9" stroke="#cbd5e1" />
    <line x1="38" y1="152" x2="102" y2="152" stroke="#cbd5e1" />
    <line x1="38" y1="162" x2="102" y2="162" stroke="#cbd5e1" />
    <line x1="38" y1="172" x2="102" y2="172" stroke="#cbd5e1" />
    
    <text x="70" y="225" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PC 8-02 (STRAIGHT)</text>
  </g>

  <!-- Right: Male Elbow Fitting (PL 8-02 90 Degree) -->
  <g transform="translate(320, 110)" filter="url(#shadow)">
    <!-- Horizontal Blue Collar -->
    <rect x="65" y="40" width="25" height="50" rx="4" fill="url(#blue-collar)" />
    <ellipse cx="90" cy="65" rx="12" ry="25" fill="url(#blue-collar)" stroke="#0369a1" stroke-width="1.5" />
    <ellipse cx="90" cy="65" rx="7" ry="16" fill="#0f172a" />

    <!-- Elbow Body -->
    <path d="M 15,40 L 65,40 L 65,110 L 15,110 Z" fill="url(#nickel)" stroke="#475569" stroke-width="2" />
    <circle cx="40" cy="75" r="30" fill="url(#nickel)" />

    <!-- Lower Hex & Thread -->
    <path d="M 20,105 L 60,105 L 65,130 L 15,130 Z" fill="url(#nickel)" />
    <rect x="22" y="130" width="36" height="55" rx="3" fill="url(#brass-thread)" stroke="#854d0e" stroke-width="1.5" />
    <!-- Teflon Sealant -->
    <rect x="22" y="145" width="36" height="28" fill="#ffffff" opacity="0.9" stroke="#cbd5e1" />

    <text x="45" y="225" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PL 8-02 (ELBOW)</text>
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">ONE-TOUCH PUSH-IN PNEUMATIC FITTINGS</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">Nickel-Plated Brass • Teflon Pre-Coated • 10 Bar Leak-Proof</text>
  </g>
</svg>
