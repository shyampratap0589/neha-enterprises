<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="enclosure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="225" fill="#ffffff" opacity="0.6" />

  <g transform="translate(130, 70)" filter="url(#shadow)">
    <!-- Heavy Base Frame Forklift Pockets -->
    <rect x="20" y="380" width="300" height="30" rx="6" fill="#020617" stroke="#1e293b" stroke-width="2" />
    <rect x="50" y="390" width="70" height="15" rx="3" fill="#334155" />
    <rect x="220" y="390" width="70" height="15" rx="3" fill="#334155" />

    <!-- Acoustic Soundproof Cabinet Housing -->
    <rect x="20" y="40" width="300" height="340" rx="14" fill="url(#enclosure)" stroke="#334155" stroke-width="3" />
    
    <!-- Accent Color Top & Side Trim -->
    <rect x="20" y="40" width="300" height="12" rx="4" fill="url(#accent-blue)" />
    <rect x="20" y="40" width="12" height="340" rx="4" fill="url(#accent-blue)" />

    <!-- Left Service Door Louvers (Air Intake Vents) -->
    <g transform="translate(45, 140)">
      <line x1="0" y1="0" x2="110" y2="0" stroke="#334155" stroke-width="3" />
      <line x1="0" y1="12" x2="110" y2="12" stroke="#334155" stroke-width="3" />
      <line x1="0" y1="24" x2="110" y2="24" stroke="#334155" stroke-width="3" />
      <line x1="0" y1="36" x2="110" y2="36" stroke="#334155" stroke-width="3" />
      <line x1="0" y1="48" x2="110" y2="48" stroke="#334155" stroke-width="3" />
      <line x1="0" y1="60" x2="110" y2="60" stroke="#334155" stroke-width="3" />
      <line x1="0" y1="72" x2="110" y2="72" stroke="#334155" stroke-width="3" />
      <line x1="0" y1="84" x2="110" y2="84" stroke="#334155" stroke-width="3" />
    </g>

    <!-- Digital Intelligent PLC Touchscreen Controller Panel -->
    <rect x="180" y="80" width="120" height="90" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="2" />
    <!-- Screen -->
    <rect x="190" y="90" width="100" height="55" rx="4" fill="#0369a1" />
    <text x="240" y="112" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">8.0 BAR • 100%</text>
    <text x="240" y="126" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">AIRFLOW: 45 CFM</text>
    <text x="240" y="138" fill="#facc15" font-family="monospace" font-size="8" text-anchor="middle">RUNNING: AUTO</text>
    
    <!-- Control Buttons -->
    <circle cx="205" cy="158" r="6" fill="#22c55e" />
    <circle cx="225" cy="158" r="6" fill="#ef4444" />
    <circle cx="270" cy="158" r="6" fill="#f59e0b" />

    <!-- Emergency Stop Mushroom Button -->
    <circle cx="280" cy="205" r="14" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <circle cx="280" cy="205" r="9" fill="#dc2626" />
    <circle cx="280" cy="205" r="18" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Neha Enterprises Branding Plate -->
    <rect x="45" y="70" width="120" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" />
    <text x="105" y="88" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">NEHA ENTERPRISES</text>
    <text x="105" y="100" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">SCREW COMPRESSOR</text>

    <!-- Lower Inspection Door Lock & Handle -->
    <rect x="45" y="270" width="250" height="95" rx="6" fill="#1e293b" opacity="0.6" stroke="#334155" />
    <rect x="160" y="280" width="20" height="40" rx="3" fill="#64748b" />
    <circle cx="170" cy="300" r="4" fill="#0f172a" />
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">ROTARY SCREW AIR COMPRESSOR</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">10 HP to 50 HP • 100% Continuous Duty • Low Noise Enclosure</text>
  </g>
</svg>
