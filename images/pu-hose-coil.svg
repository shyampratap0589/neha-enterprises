<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="blue-hose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hose-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="220" fill="#ffffff" opacity="0.6" />

  <!-- 100M Polyurethane Hose Coil Roll -->
  <g transform="translate(100, 90)" filter="url(#shadow)">
    <!-- Concentric Coil Rings -->
    <ellipse cx="200" cy="200" rx="190" ry="150" fill="none" stroke="url(#blue-hose)" stroke-width="32" stroke-linecap="round" />
    <ellipse cx="200" cy="200" rx="160" ry="125" fill="none" stroke="url(#hose-sheen)" stroke-width="30" stroke-linecap="round" />
    <ellipse cx="200" cy="200" rx="130" ry="100" fill="none" stroke="url(#blue-hose)" stroke-width="28" stroke-linecap="round" />
    <ellipse cx="200" cy="200" rx="100" ry="75" fill="none" stroke="url(#hose-sheen)" stroke-width="26" stroke-linecap="round" />
    <ellipse cx="200" cy="200" rx="72" ry="52" fill="none" stroke="url(#blue-hose)" stroke-width="24" stroke-linecap="round" />

    <!-- Center Packaging Core & Straps -->
    <rect x="190" y="50" width="20" height="300" rx="4" fill="#0f172a" opacity="0.8" />
    <rect x="100" y="190" width="200" height="20" rx="4" fill="#0f172a" opacity="0.8" />

    <!-- Leading Hose End projecting outwards -->
    <path d="M 330,130 C 370,110 390,70 380,40" fill="none" stroke="url(#blue-hose)" stroke-width="24" stroke-linecap="round" />
    <circle cx="380" cy="40" r="12" fill="#0f172a" />
    <circle cx="380" cy="40" r="7.5" fill="#f8fafc" />

    <!-- Central Packaging Brand Label -->
    <circle cx="200" cy="200" r="50" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <text x="200" y="190" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">NEHA ENTERPRISES</text>
    <text x="200" y="206" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PU 8x5mm</text>
    <text x="200" y="222" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">100 METERS</text>
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">POLYURETHANE (PU) PNEUMATIC TUBING COIL</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">100% Virgin Ether Grade • 10 Bar Flexible Air Hose • 100m Roll</text>
  </g>
</svg>
