<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="shield-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="pedal-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="225" fill="#ffffff" opacity="0.6" />

  <g transform="translate(130, 110)" filter="url(#shadow)">
    <!-- Heavy Cast Aluminum Base Plate with Floor Mounting Holes -->
    <rect x="20" y="270" width="300" height="40" rx="8" fill="#334155" stroke="#1e293b" stroke-width="2" />
    <circle cx="45" cy="290" r="8" fill="#0f172a" />
    <circle cx="295" cy="290" r="8" fill="#0f172a" />

    <!-- Protective Safety Foot Shield Guard (Yellow Anti-Accident Cover) -->
    <path d="M 40,270 L 40,90 C 40,50 300,50 300,90 L 300,270 Z" fill="url(#shield-yellow)" stroke="#a16207" stroke-width="3" />
    <!-- Shield Opening Arch -->
    <path d="M 60,270 L 60,130 C 60,95 280,95 280,130 L 280,270 Z" fill="#1e293b" opacity="0.85" />

    <!-- Anti-Skid Internal Foot Treadle Pedal -->
    <path d="M 80,250 L 110,130 L 230,130 L 260,250 Z" fill="url(#pedal-dark)" stroke="#64748b" stroke-width="2" />
    <!-- Treadle Grips -->
    <line x1="100" y1="160" x2="240" y2="160" stroke="#94a3b8" stroke-width="3" />
    <line x1="95" y1="185" x2="245" y2="185" stroke="#94a3b8" stroke-width="3" />
    <line x1="90" y1="210" x2="250" y2="210" stroke="#94a3b8" stroke-width="3" />
    <line x1="85" y1="235" x2="255" y2="235" stroke="#94a3b8" stroke-width="3" />

    <!-- Pneumatic Valve Body at Rear with 1/4" Threaded Ports -->
    <rect x="290" y="220" width="35" height="50" rx="4" fill="#cbd5e1" stroke="#475569" />
    <circle cx="315" cy="235" r="7" fill="#eab308" stroke="#854d0e" />
    <circle cx="315" cy="255" r="7" fill="#eab308" stroke="#854d0e" />

    <!-- Nameplate on Top of Shield -->
    <rect x="90" y="70" width="160" height="30" rx="4" fill="#0f172a" />
    <text x="170" y="87" fill="#fde047" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">FV-420 FOOT VALVE</text>
    <text x="170" y="96" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">5/2 WAY SPRING RETURN</text>
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">PNEUMATIC FOOT TREADLE PEDAL VALVE</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">FV-420 • Safety Shield Cover • Hands-Free Clamping & Press Control</text>
  </g>
</svg>
