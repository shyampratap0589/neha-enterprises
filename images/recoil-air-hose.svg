<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="orange-hose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="225" fill="#ffffff" opacity="0.6" />

  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- Spiral Coils of Recoil Air Hose (Orange Polyurethane) -->
    <g transform="translate(60, 40)">
      <!-- Repeated spring loops -->
      <path d="M 40,60 C 120,20 180,60 180,100 C 180,140 100,160 60,130 C 20,100 40,60 40,60" fill="none" stroke="url(#orange-hose)" stroke-width="20" stroke-linecap="round" />
      <path d="M 60,110 C 140,70 200,110 200,150 C 200,190 120,210 80,180 C 40,150 60,110 60,110" fill="none" stroke="url(#orange-hose)" stroke-width="20" stroke-linecap="round" />
      <path d="M 80,160 C 160,120 220,160 220,200 C 220,240 140,260 100,230 C 60,200 80,160 80,160" fill="none" stroke="url(#orange-hose)" stroke-width="20" stroke-linecap="round" />
      <path d="M 100,210 C 180,170 240,210 240,250 C 240,290 160,310 120,280 C 80,250 100,210 100,210" fill="none" stroke="url(#orange-hose)" stroke-width="20" stroke-linecap="round" />
    </g>

    <!-- Top Pigtail Tail with Spring Bend Restrictor & Brass Quick Coupler -->
    <path d="M 100,100 L 40,40" fill="none" stroke="url(#orange-hose)" stroke-width="18" stroke-linecap="round" />
    <!-- Steel Bend Restrictor Spring -->
    <path d="M 45,45 L 30,30" stroke="#64748b" stroke-width="22" stroke-dasharray="2 3" />
    <!-- Brass 1/4" Swivel Fitting -->
    <rect x="10" y="10" width="22" height="25" rx="3" fill="url(#brass)" stroke="#78350f" transform="rotate(-45 20 20)" />

    <!-- Bottom Pigtail Tail with Female Coupler -->
    <path d="M 220,320 L 320,350" fill="none" stroke="url(#orange-hose)" stroke-width="18" stroke-linecap="round" />
    <!-- Spring Restrictor -->
    <path d="M 290,340 L 315,350" stroke="#64748b" stroke-width="22" stroke-dasharray="2 3" />
    <!-- Brass Nut & Chrome Socket -->
    <rect x="325" y="340" width="35" height="24" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2" />

    <!-- Center Spec Badge -->
    <rect x="110" y="170" width="160" height="40" rx="6" fill="#0f172a" />
    <text x="190" y="188" fill="#fb923c" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PU RECOIL HOSE</text>
    <text x="190" y="202" fill="#facc15" font-family="monospace" font-size="9" text-anchor="middle">10m / 15m SPRING COIL</text>
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">SPIRAL PU RECOIL SPRING AIR HOSE</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">Anti-Kink Self-Retracting • Heavy Brass 360° Swivel Couplers</text>
  </g>
</svg>
