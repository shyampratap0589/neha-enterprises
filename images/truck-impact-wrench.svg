<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="truck-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chrome-anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="225" fill="#ffffff" opacity="0.6" />

  <g transform="translate(80, 140)" filter="url(#shadow)">
    <!-- 6" Extended 1" Square Drive Anvil extending forward -->
    <rect x="330" y="80" width="140" height="38" rx="4" fill="url(#chrome-anvil)" stroke="#334155" stroke-width="2" />
    <!-- 1" Square Drive Tip with Retaining Ring Hole -->
    <rect x="440" y="82" width="30" height="34" rx="2" fill="#1e293b" />
    <circle cx="455" cy="99" r="6" fill="#f8fafc" />

    <!-- Front Hammer Nose Cone (Heavy Cast Steel) -->
    <path d="M 240,40 L 330,65 L 330,135 L 240,160 Z" fill="url(#truck-metal)" stroke="#0f172a" stroke-width="2.5" />

    <!-- Main Motor Housing (Heavy Industrial Steel with Ribs) -->
    <rect x="110" y="30" width="130" height="140" rx="14" fill="url(#truck-metal)" stroke="#0f172a" stroke-width="3" />
    <!-- Grip Ribs & Bolts -->
    <circle cx="130" cy="50" r="6" fill="#64748b" />
    <circle cx="130" cy="150" r="6" fill="#64748b" />
    <circle cx="220" cy="50" r="6" fill="#64748b" />
    <circle cx="220" cy="150" r="6" fill="#64748b" />

    <!-- Side Auxiliary Support D-Handle for 2-Handed Operation -->
    <path d="M 200,30 C 200,-20 280,-20 280,45" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round" />
    <path d="M 220,-10 L 260,-10" stroke="#0f172a" stroke-width="6" />

    <!-- Rear D-Handle with Inside Safety Trigger -->
    <path d="M 110,60 C 20,60 20,140 110,140" fill="none" stroke="url(#truck-metal)" stroke-width="28" stroke-linecap="round" />
    <!-- Trigger Lever inside D-Handle -->
    <rect x="65" y="85" width="14" height="30" rx="4" fill="#ef4444" stroke="#991b1b" />

    <!-- Bottom 1/2" Air Inlet Fitting -->
    <rect x="60" y="150" width="22" height="30" rx="3" fill="#eab308" stroke="#854d0e" stroke-width="1.5" />
    <rect x="62" y="180" width="18" height="15" fill="#ca8a04" />

    <!-- Heavy Torque Badge -->
    <rect x="125" y="80" width="100" height="38" rx="4" fill="#0284c7" />
    <text x="175" y="96" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1" DRIVE • 2600 Nm</text>
    <text x="175" y="110" fill="#facc15" font-family="monospace" font-size="9" text-anchor="middle">HEAVY TRUCK GUN</text>
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">1" HEAVY TRUCK & MINING AIR IMPACT WRENCH</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">2,600 Nm Extreme Torque • 6" Extended Anvil for Dual Truck Tyres</text>
  </g>
</svg>
