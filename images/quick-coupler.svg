<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="chrome-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="215" fill="#ffffff" opacity="0.6" />

  <!-- Female Coupler Socket (Left) & Male Plug (Right) -->
  <g transform="translate(100, 140)" filter="url(#shadow)">
    <!-- FEMALE SOCKET (SM-20) -->
    <!-- Rear Male Thread -->
    <rect x="20" y="70" width="50" height="40" rx="3" fill="url(#brass)" stroke="#713f12" stroke-width="1.5" />
    <line x1="20" y1="80" x2="70" y2="80" stroke="#713f12" />
    <line x1="20" y1="90" x2="70" y2="90" stroke="#713f12" />
    <line x1="20" y1="100" x2="70" y2="100" stroke="#713f12" />

    <!-- Hex Nut Body -->
    <path d="M 65,55 L 115,55 L 115,125 L 65,125 Z" fill="url(#chrome-shine)" stroke="#475569" stroke-width="2" />
    
    <!-- Sliding Ball Sleeve Collar -->
    <rect x="115" y="45" width="80" height="90" rx="8" fill="url(#chrome-shine)" stroke="#334155" stroke-width="2" />
    <!-- Knurled Grip Bands on Sleeve -->
    <rect x="135" y="45" width="40" height="90" fill="#64748b" opacity="0.3" stroke="#475569" stroke-dasharray="2 3" />

    <!-- Front Mating Opening -->
    <ellipse cx="195" cy="90" rx="8" ry="35" fill="#0f172a" />

    <!-- MALE PLUG (PM-20) -->
    <!-- Front Insertion Nipple with Ball Groove -->
    <rect x="250" y="76" width="35" height="28" rx="2" fill="url(#chrome-shine)" stroke="#475569" />
    <rect x="262" y="72" width="12" height="36" rx="4" fill="#64748b" />
    
    <!-- Plug Hex Nut -->
    <rect x="285" y="60" width="45" height="60" rx="4" fill="url(#chrome-shine)" stroke="#475569" stroke-width="2" />

    <!-- Plug Male Thread -->
    <rect x="330" y="68" width="55" height="44" rx="3" fill="url(#brass)" stroke="#713f12" stroke-width="1.5" />
    <line x1="330" y1="80" x2="385" y2="80" stroke="#713f12" />
    <line x1="330" y1="92" x2="385" y2="92" stroke="#713f12" />
    <line x1="330" y1="102" x2="385" y2="102" stroke="#713f12" />

    <text x="110" y="165" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">FEMALE (SM-20)</text>
    <text x="315" y="165" fill="#0f172a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MALE (PM-20)</text>
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">QUICK RELEASE PNEUMATIC COUPLER SET</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">Nitto Type • Chrome Hardened Steel • Automatic Shut-off Valve</text>
  </g>
</svg>
