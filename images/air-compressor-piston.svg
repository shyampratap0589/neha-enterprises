<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="pump-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="motor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="225" fill="#ffffff" opacity="0.6" />

  <g transform="translate(60, 90)" filter="url(#shadow)">
    <!-- Tank Support Legs & Heavy Wheels -->
    <!-- Rear Wheel Left -->
    <circle cx="100" cy="370" r="32" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <circle cx="100" cy="370" r="14" fill="#94a3b8" />
    <!-- Rear Wheel Right -->
    <circle cx="380" cy="370" r="32" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <circle cx="380" cy="370" r="14" fill="#94a3b8" />
    <!-- Front Support Stand Leg -->
    <path d="M 230,340 L 230,380 L 250,380 L 250,340 Z" fill="#334155" />
    <rect x="220" y="380" width="40" height="12" rx="3" fill="#0f172a" />

    <!-- Main Horizontal Receiver Pressure Air Tank (220L / 500L) -->
    <rect x="50" y="220" width="380" height="130" rx="65" fill="url(#tank)" stroke="#0284c7" stroke-width="3" />
    <!-- Tank End Dished Heads Weld Seams -->
    <path d="M 115,220 A 65 65 0 0 1 115,350" fill="none" stroke="#075985" stroke-width="3" opacity="0.6" />
    <path d="M 365,220 A 65 65 0 0 0 365,350" fill="none" stroke="#075985" stroke-width="3" opacity="0.6" />

    <!-- Tank Brand Plate -->
    <rect x="140" y="260" width="200" height="48" rx="6" fill="#0f172a" />
    <text x="240" y="282" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">NEHA ENTERPRISES</text>
    <text x="240" y="298" fill="#facc15" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">5 HP • 220L • 10 BAR TANK</text>

    <!-- Base Plate Mounting Deck for Motor and Pump -->
    <rect x="90" y="200" width="300" height="22" rx="4" fill="#334155" stroke="#1e293b" stroke-width="2" />

    <!-- Electric Motor (Right side) -->
    <rect x="280" y="115" width="100" height="85" rx="10" fill="url(#motor)" stroke="#0369a1" stroke-width="2" />
    <!-- Motor Cooling Fins -->
    <line x1="295" y1="120" x2="295" y2="195" stroke="#0284c7" stroke-width="2.5" />
    <line x1="310" y1="120" x2="310" y2="195" stroke="#0284c7" stroke-width="2.5" />
    <line x1="325" y1="120" x2="325" y2="195" stroke="#0284c7" stroke-width="2.5" />
    <line x1="340" y1="120" x2="340" y2="195" stroke="#0284c7" stroke-width="2.5" />
    <line x1="355" y1="120" x2="355" y2="195" stroke="#0284c7" stroke-width="2.5" />
    <!-- Motor Terminal Junction Box -->
    <rect x="300" y="98" width="45" height="18" rx="3" fill="#1e293b" />

    <!-- Belt Drive Mesh Guard (Center-Right) -->
    <path d="M 230,80 L 360,110 L 360,185 L 210,185 Z" fill="#e2e8f0" opacity="0.35" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3" />

    <!-- 2-Cylinder V-Twin Heavy Cast Iron Pump Head (Left side) -->
    <!-- Crankcase -->
    <rect x="110" y="145" width="95" height="55" rx="8" fill="url(#pump-metal)" stroke="#0f172a" stroke-width="2" />
    <!-- Cylinder 1 with Cooling Fins -->
    <path d="M 115,145 L 100,75 L 140,75 L 145,145 Z" fill="url(#pump-metal)" stroke="#0f172a" stroke-width="2" />
    <line x1="105" y1="90" x2="135" y2="90" stroke="#94a3b8" stroke-width="2" />
    <line x1="108" y1="105" x2="138" y2="105" stroke="#94a3b8" stroke-width="2" />
    <line x1="110" y1="120" x2="140" y2="120" stroke="#94a3b8" stroke-width="2" />
    <circle cx="120" cy="65" r="15" fill="#1e293b" />
    <!-- Cylinder 2 (V-Twin) -->
    <path d="M 160,145 L 180,75 L 220,75 L 195,145 Z" fill="url(#pump-metal)" stroke="#0f172a" stroke-width="2" />
    <line x1="180" y1="90" x2="210" y2="90" stroke="#94a3b8" stroke-width="2" />
    <line x1="178" y1="105" x2="208" y2="105" stroke="#94a3b8" stroke-width="2" />
    <line x1="175" y1="120" x2="205" y2="120" stroke="#94a3b8" stroke-width="2" />
    <circle cx="200" cy="65" r="15" fill="#1e293b" />

    <!-- Air Intake Filters (Black Cans) -->
    <rect x="85" y="48" width="22" height="28" rx="4" fill="#0f172a" />
    <rect x="210" y="48" width="22" height="28" rx="4" fill="#0f172a" />

    <!-- Copper Aftercooler Discharge Pipe -->
    <path d="M 160,85 C 160,120 220,120 220,200 L 220,220" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round" />

    <!-- Pressure Switch & Regulator Manifold on Tank -->
    <rect x="390" y="160" width="30" height="40" rx="4" fill="#0f172a" />
    <circle cx="405" cy="148" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <line x1="405" y1="148" x2="412" y2="140" stroke="#ef4444" stroke-width="2" />
    <!-- Brass Ball Valve Outlet Tap -->
    <rect x="420" y="180" width="25" height="15" fill="#eab308" stroke="#854d0e" />
    <rect x="435" y="170" width="18" height="6" rx="2" fill="#ef4444" />
    <!-- Safety Relief Valve -->
    <rect x="375" y="195" width="12" height="20" fill="#eab308" stroke="#854d0e" />
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">INDUSTRIAL PISTON AIR COMPRESSOR</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">3 HP to 15 HP • 150L to 500L Tank • 10 to 12 Bar Cast Iron Pump</text>
  </g>
</svg>
