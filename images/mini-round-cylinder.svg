<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="ss-barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="blue-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="210" fill="#ffffff" opacity="0.6" />

  <g transform="translate(60, 150)" filter="url(#shadow)">
    <!-- Stainless Rod extending out -->
    <rect x="360" y="115" width="120" height="18" rx="2" fill="url(#ss-barrel)" stroke="#475569" />
    <!-- Rod Thread -->
    <rect x="440" y="117" width="25" height="14" fill="#cbd5e1" stroke="#64748b" stroke-dasharray="2 1" />

    <!-- Rear Clevis Mount (Anodized Blue) -->
    <path d="M 40,110 L 80,100 L 80,150 L 40,140 Z" fill="url(#blue-cap)" stroke="#0369a1" stroke-width="1.5" />
    <circle cx="55" cy="125" r="9" fill="#0f172a" opacity="0.4" />
    <circle cx="55" cy="125" r="5" fill="#f8fafc" />

    <!-- Rear Cap -->
    <rect x="80" y="90" width="40" height="70" rx="8" fill="url(#blue-cap)" stroke="#0369a1" stroke-width="2" />
    <!-- Port -->
    <circle cx="100" cy="102" r="6" fill="#eab308" stroke="#713f12" />

    <!-- Round Barrel (Aluminum/SS) -->
    <rect x="120" y="95" width="210" height="60" rx="4" fill="url(#ss-barrel)" stroke="#475569" stroke-width="2" />
    
    <!-- Branding Label -->
    <rect x="170" y="112" width="110" height="26" rx="4" fill="#0f172a" />
    <text x="225" y="129" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MAL-25x150-CA</text>

    <!-- Front Cap with Nose Thread -->
    <rect x="330" y="90" width="40" height="70" rx="8" fill="url(#blue-cap)" stroke="#0369a1" stroke-width="2" />
    <circle cx="350" cy="102" r="6" fill="#eab308" stroke="#713f12" />
    <!-- Nose Thread for Panel Mounting -->
    <rect x="370" y="105" width="22" height="40" rx="2" fill="url(#ss-barrel)" stroke="#64748b" stroke-dasharray="2 1" />
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">MINI ROUND BODY AIR CYLINDER</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">MAL Series • Stainless Steel Rod & Clevis Pivot</text>
  </g>
</svg>
