<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="valve-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="coil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)" rx="16" />
  <circle cx="300" cy="300" r="215" fill="#ffffff" opacity="0.6" />

  <g transform="translate(130, 80)" filter="url(#shadow)">
    <!-- Electric Solenoid Coil (Black Polymer block with DIN connector) -->
    <rect x="40" y="30" width="120" height="130" rx="10" fill="url(#coil)" stroke="#020617" stroke-width="2" />
    
    <!-- DIN 43650 Connector Plug with Indicator LED -->
    <rect x="25" y="55" width="30" height="40" rx="4" fill="#1e293b" />
    <circle cx="38" cy="75" r="5" fill="#22c55e" stroke="#15803d" />
    <!-- Connector Retaining Center Screw -->
    <circle cx="100" cy="45" r="7" fill="#94a3b8" stroke="#475569" />
    <line x1="97" y1="45" x2="103" y2="45" stroke="#0f172a" stroke-width="1.5" />

    <!-- Coil Label -->
    <rect x="55" y="105" width="90" height="34" rx="3" fill="#1e293b" />
    <text x="100" y="122" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">24V DC / 220V</text>
    <text x="100" y="133" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">IP65 DIN COIL</text>

    <!-- Pilot Valve Stem Connection -->
    <rect x="75" y="160" width="50" height="25" fill="#94a3b8" stroke="#475569" />
    <!-- Manual Override Button (Red / Orange) -->
    <circle cx="140" cy="172" r="8" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" />

    <!-- Main Die-Cast Aluminum Valve Body (5-Port Spool) -->
    <rect x="40" y="185" width="260" height="150" rx="12" fill="url(#valve-body)" stroke="#475569" stroke-width="2.5" />
    
    <!-- Top Working Ports (A and B Ports) -->
    <rect x="110" y="172" width="35" height="18" rx="4" fill="#eab308" stroke="#854d0e" stroke-width="1.5" />
    <ellipse cx="127" cy="172" rx="12" ry="4" fill="#713f12" />
    <text x="127" y="215" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">A</text>

    <rect x="200" y="172" width="35" height="18" rx="4" fill="#eab308" stroke="#854d0e" stroke-width="1.5" />
    <ellipse cx="217" cy="172" rx="12" ry="4" fill="#713f12" />
    <text x="217" y="215" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">B</text>

    <!-- Bottom Inlet & Exhaust Ports (P, R, S) -->
    <!-- Exhaust R -->
    <rect x="80" y="325" width="30" height="18" rx="4" fill="#eab308" stroke="#854d0e" stroke-width="1.5" />
    <text x="95" y="315" fill="#475569" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">R</text>

    <!-- Pressure Inlet P -->
    <rect x="155" y="325" width="35" height="18" rx="4" fill="#eab308" stroke="#854d0e" stroke-width="1.5" />
    <text x="172" y="315" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">P</text>

    <!-- Exhaust S -->
    <rect x="230" y="325" width="30" height="18" rx="4" fill="#eab308" stroke="#854d0e" stroke-width="1.5" />
    <text x="245" y="315" fill="#475569" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">S</text>

    <!-- Body Nameplate / Schematic -->
    <rect x="80" y="235" width="180" height="50" rx="4" fill="#0f172a" />
    <text x="170" y="255" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">MODEL: 4V210-08</text>
    <text x="170" y="272" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">5/2 WAY • 1.5 - 8.0 BAR</text>
  </g>

  <g transform="translate(30, 520)">
    <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">5/2 WAY PILOT SOLENOID VALVE</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12">4V210-08 Series • Fast Switching Cylinder Control</text>
  </g>
</svg>
